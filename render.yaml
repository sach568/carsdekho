services:
  - type: web
    name: carsdekho
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main

    # Environment Variables (Render Dashboard mein bhi add karna)
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://carsdekho.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      # Database variables (PostgreSQL ke liye)
      - key: DB_CONNECTION
        value: pgsql
      # APP_KEY yahan nahi, Render Dashboard mein manually add karna

    # Auto-deploy settings
    autoDeploy: true

    # Health check
    healthCheckPath: /
    healthCheckTimeout: 30

    # Build settings
    buildFilter:
      paths:
        - /**
      ignoredPaths:
        - node_modules/**
        - vendor/**
        - storage/**

    # Resource limits
    resources:
      memory: 512
      cpu: 0.25
