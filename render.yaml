services:
  - type: web
    name: carsdekho
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main

    # Environment Variables
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://carsdekho.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-d596ml75r7bs73936sm0-a
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: car_website
      # Add these in Render Dashboard (not here for security)
      # - key: DB_USERNAME
      # - key: DB_PASSWORD
      # - key: APP_KEY

    autoDeploy: true
    healthCheckPath: /
